name: CI

on:
  push:
    branches: [main]
  pull_request:


permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Lint
        run: ESLINT_USE_FLAT_CONFIG=false npx eslint . --rule 'react-hooks/exhaustive-deps: off'
      - run: npm run build
