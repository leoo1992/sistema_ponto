name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - run: node --test tests/quality.test.mjs
      - run: npx --yes eslint@8 . --ext ts,tsx --report-unused-disable-directives --max-warnings 0
      - run: npm run build
